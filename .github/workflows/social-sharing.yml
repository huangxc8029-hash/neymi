name: Neymi social sharing checks

on:
  pull_request:
    paths:
      - 'Neymi_v1.2/Neymi_Dev_Package_v1.2/**'
      - '.github/workflows/social-sharing.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neymi_v1.2/Neymi_Dev_Package_v1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Neymi_v1.2/Neymi_Dev_Package_v1.2/package-lock.json
      # Existing repository lockfile currently lacks two optional @emnapi entries.
      # Use a regular install for validation; regenerate and commit the lockfile before release.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run tests/unit/social-preview.test.ts tests/integration/publication.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.quick-share.config.ts
